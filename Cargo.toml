[package]
name = "kv_lib"
version = "0.1.3"
edition = "2024"
description = "Generic key-value store with vector search for Piksel"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]
name = "kv_lib"

[dependencies]
anyhow = "1.0"
libloading = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
llama-cpp-2 = "0.1.160"
turbovec = "1.1.2"

[dev-dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
tempfile = "3"
